<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="robots" content="noindex">
<title>Reperto 03</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Roboto+Condensed:wght@400;700&display=swap">
<style>
/* Android 4.x (Holo Dark), 2013. Su smartphone a tutto schermo, su computer dentro una cornice. */
:root{
  --desk:#15171a; --frame:#0a0a0b; --surface:#1d1f22; --list:#111315; --line:#2b2e32;
  --fg:#e9eaec; --muted:#8d939a; --accent:#33b5e5; --alert:#ff4444; --ok:#99cc00; --me:#1f4f63;
  --f-ui:"Roboto","Helvetica Neue",Arial,sans-serif; --f-cond:"Roboto Condensed","Roboto","Arial Narrow",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--fg);font-family:var(--f-ui);font-size:14px;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.phone{width:360px;height:720px;background:var(--frame);border-radius:34px;padding:54px 12px 62px;position:relative;box-shadow:0 0 0 2px #2a2c30,0 30px 60px rgba(0,0,0,.5)}
.phone::before{content:"";position:absolute;top:25px;left:50%;width:60px;height:6px;margin-left:-30px;border-radius:3px;background:#222}
.screen{height:100%;background:#000;overflow:hidden;display:flex;flex-direction:column;position:relative}
.navbar{display:none}
@media (max-width:600px),(pointer:coarse) and (max-width:900px){
  .stage{padding:0;display:block;height:100%}
  .phone{width:100%;height:100%;border-radius:0;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) 0 env(safe-area-inset-left,0);box-shadow:none}
  .phone::before{display:none}
  .navbar{display:flex}
}
/* barra di stato */
.status{height:24px;flex:none;display:flex;justify-content:flex-end;align-items:center;gap:7px;padding:0 8px;font-size:12px;background:#000;color:#cfd2d5}
.status .sig{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
.status .sig i{width:3px;background:var(--accent);display:block}
.batt{width:9px;height:14px;border:1.5px solid #cfd2d5;border-radius:1px;position:relative}
.batt::after{content:"";position:absolute;left:1px;right:1px;bottom:1px;height:15%;background:var(--alert)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
/* barra di navigazione Android in basso (solo su smartphone) */
.navbar{flex:none;height:44px;background:#000;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom,0)}
.navbar button{width:64px;height:40px;display:grid;place-items:center}
.navbar svg{width:22px;height:22px;stroke:#cfd2d5;fill:none;stroke-width:2}
/* blocco */
.lock{background:radial-gradient(120% 80% at 30% 10%,#123447 0%,#06121a 55%,#000 100%);align-items:center;padding:20px 16px;overflow:auto}
.clock{font-weight:300;font-size:64px;letter-spacing:-1px;margin-top:10px;font-variant-numeric:tabular-nums}
.date{color:var(--accent);font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.08em;font-size:13px;margin-top:14px}
.hint{margin-top:6px;font-size:11px;color:var(--muted);min-height:14px;text-align:center}
.notif{margin-top:10px;font-size:12px;color:var(--muted);min-height:16px;text-align:center}
.dots{display:flex;gap:14px;margin:22px 0 14px}
.dots span{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--accent)}
.dots span.on{background:var(--accent)}
.dots.err span{border-color:var(--alert)}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px 22px}
.pad button{height:58px;border-radius:50%;font-size:26px;font-weight:300;text-align:center}
.pad button:active{background:rgba(51,181,229,.25)}
.pad small{display:block;font-size:9px;color:var(--muted);letter-spacing:.1em;margin-top:-4px}
.lockmsg{min-height:18px;font-size:12px;color:var(--alert);margin-top:6px}
/* home */
.home{background:radial-gradient(100% 70% at 70% 0%,#173b2e 0%,#071510 60%,#000 100%);padding:26px 18px}
.homedate{font-family:var(--f-cond);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.hometime{font-size:44px;font-weight:300;margin-bottom:28px;font-variant-numeric:tabular-nums}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px 8px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;text-align:center}
.ico{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 6px rgba(0,0,0,.5)}
.ico svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-5px;right:-5px;background:var(--alert);font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
/* app */
.bar{flex:none;height:48px;display:flex;align-items:center;gap:8px;padding:0 6px;background:var(--surface);border-bottom:2px solid var(--accent)}
.bar b{font-weight:400;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:38px;height:38px;display:grid;place-items:center;flex:none}
.back svg{width:20px;height:20px;stroke:var(--accent);stroke-width:2.5;fill:none}
.tabs{flex:none;display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs button{flex:1;text-align:center;padding:11px 4px;font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--fg);border-color:var(--accent)}
.scroll{flex:1;overflow-y:auto;min-height:0;background:var(--list);-webkit-overflow-scrolling:touch}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);width:100%}
button.row:active{background:rgba(51,181,229,.15)}
.av{width:40px;height:40px;flex:none;border-radius:2px;display:grid;place-items:center;font-family:var(--f-cond);font-size:18px;background:#38424a}
.rmain{flex:1;min-width:0;display:block}
.rtop{display:flex;justify-content:space-between;gap:8px}
.rname{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtime{font-size:11px;color:var(--muted);white-space:nowrap;flex:none}
.rsub{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread .rname{font-weight:500}
.unread .rsub{color:var(--fg)}
.unread .rtime{color:var(--accent)}
.sect{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--accent);padding:14px 14px 6px;border-bottom:1px solid var(--line)}
.empty{padding:48px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
/* chat */
.chat{padding:12px 10px;display:flex;flex-direction:column;gap:6px}
.day{align-self:center;font-size:11px;color:var(--muted);background:#1c1f22;padding:3px 10px;border-radius:2px;margin:8px 0}
.msg{max-width:82%;padding:7px 10px 5px;border-radius:3px;font-size:14px;line-height:1.35;background:#25292d;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--me)}
.msg time{display:block;text-align:right;font-size:10px;color:var(--muted);margin-top:2px}
.msg.me time{color:#9cc6d6}
/* chiamate */
.cdir{width:22px;flex:none;text-align:center;font-size:16px}
.entrata{color:var(--ok)}.uscita{color:var(--accent)}.persa{color:var(--alert)}
/* galleria */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
.ph{aspect-ratio:1;max-width:100%;display:block;background:#2a2e33 center/cover no-repeat;position:relative;overflow:hidden}
.ph span{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:10px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff}
.big{display:block;width:100%;max-height:60vh;object-fit:contain;background:#000}
.bigph{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;background:#2a2e33;color:var(--muted);font-size:13px}
.meta{margin:12px 14px;font-size:13px;line-height:1.6}
.meta dt{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-family:var(--f-cond)}
.meta dd{margin:0 0 8px;white-space:pre-wrap}
/* note */
.note{padding:16px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;background:#f3edc9;color:#2c2a20;min-height:100%}
/* accesso protetto */
.locked{padding:32px 20px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.locked svg{width:44px;height:44px;stroke:var(--accent);fill:none;stroke-width:2}
.locked .who{font-size:13px;color:var(--muted)}
.locked input{width:100%;max-width:240px;background:#000;border:0;border-bottom:2px solid var(--accent);color:var(--fg);font-size:18px;text-align:center;padding:8px;border-radius:0}
.btn{background:var(--surface);border:1px solid var(--line);padding:10px 22px;font-size:14px;text-align:center}
.btn:active{background:#2a2e33}
.err{color:var(--alert);font-size:12px;min-height:16px}
.wait{color:var(--muted);font-size:12px;min-height:16px}
/* email */
.mailhead{padding:14px;border-bottom:1px solid var(--line);background:var(--surface)}
.mailhead h2{font-size:17px;font-weight:400;margin:0 0 10px;line-height:1.3}
.mailhead p{margin:2px 0;font-size:12.5px;color:var(--muted);word-break:break-word}
.mailbody{padding:16px 14px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.att{margin:0 14px 16px;display:flex;flex-direction:column;gap:8px}
.attitem{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;width:100%}
.attitem svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2;flex:none}
.attimg{display:block;width:100%;margin-top:6px}
/* Spunta (chat) */
.bar.sp{background:#1e6b55;border-bottom:0}
.bar.sp .back svg{stroke:#fff}
.bar .sub{display:block;font-size:11.5px;color:#cfe7de;font-weight:400}
.bar .ttl{flex:1;min-width:0;display:block}
.bar .ttl b{display:block}
.sp-list{background:#fff;color:#1d1d1d}
.sp-list .row{border-color:#ececec}
.sp-list .rsub{color:#7a7a7a}
.sp-list .rtime{color:#8a8a8a}
.sp-list .unread .rtime{color:#2a9c74}
.sp-list .unread .rsub{color:#1d1d1d}
.sp-list .av{border-radius:50%;color:#fff}
.sp-list .empty{color:#888}
.sp-chat{background:#e6ded1}
.sp-chat .day{background:#d5e9f3;color:#4a5a63;border-radius:6px}
.sp-chat .msg{background:#fff;color:#1d1d1d;border-radius:7px;box-shadow:0 1px 1px rgba(0,0,0,.13)}
.sp-chat .msg.me{background:#d9f3c3}
.sp-chat .msg time{color:#8a8a8a}
.sp-chat .msg.me time{color:#6f8d62}
.tick{letter-spacing:-4px;margin-left:3px;color:#8a9a8a}
.sp-chat .empty{color:#6b6b6b}
/* calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:8px 6px;background:var(--surface);border-bottom:1px solid var(--line)}
.cal-head b{font-weight:400;font-size:16px;text-transform:capitalize}
.cal-head button{width:40px;height:36px;display:grid;place-items:center;color:var(--accent);font-size:20px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.cal-grid span,.cal-grid button{background:var(--list);height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.cal-grid .wd{height:26px;font-family:var(--f-cond);font-size:11px;color:var(--muted);text-transform:uppercase}
.cal-grid .out{color:#4a4f55}
.cal-grid .has::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:3px}
.cal-grid .sel{background:#173544;color:#fff}
.cal-grid .today{color:var(--accent);font-weight:500}
.ev{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ev .bar2{width:4px;flex:none;background:var(--accent);border-radius:2px}
.ev b{font-weight:500;font-size:14px;display:block}
.ev span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;white-space:pre-wrap}
/* posizioni */
.gm-day{display:flex;align-items:center;justify-content:space-between;padding:14px 10px;border-bottom:1px solid var(--line)}
.gm-day b{font-weight:400;font-size:17px}
.gm-day button{background:none;border:0;color:var(--fg,#fff);font-size:28px;width:44px;height:36px;line-height:1}
.gm-day button:disabled{opacity:.25}
.gm-sum{display:flex;justify-content:center;gap:44px;padding:12px;border-bottom:1px solid var(--line)}
.gm-s{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;line-height:1.35}
.gm-s svg{width:28px;height:28px;color:#e8eaed}
.gm-list{padding:10px 0 24px}
.gm-row{display:grid;grid-template-columns:56px 1fr;padding:0 14px 0 6px;min-height:84px;position:relative}
.gm-row::before{content:"";position:absolute;left:33px;top:0;bottom:0;width:2px;background:#5f6368}
.gm-row:first-child::before{top:30px}.gm-row:last-child::before{bottom:calc(100% - 30px)}
.gm-ic{position:relative;z-index:1;margin:8px auto 0;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--list)}
.gm-ic.dot{background:#7b95a3;box-shadow:0 0 0 4px var(--list)}
.gm-ic.dot::after{content:"";width:9px;height:9px;border-radius:50%;background:#2a3238}
.gm-ic.car{border:2px solid #e8eaed;box-shadow:0 0 0 4px var(--list)}
.gm-ic.car svg{width:16px;height:16px;color:#e8eaed}
.gm-tx{padding:6px 0 14px}
.gm-tx b{display:block;font-weight:400;font-size:16px;margin-bottom:3px}
.gm-tx span{display:block;font-size:13px;color:var(--muted);line-height:1.45}
.mapimg{display:block;width:100%;background:#1b241e}
.tl{padding:12px 14px 20px}
.stop{display:grid;grid-template-columns:48px 16px 1fr;gap:10px;min-height:60px}
.stop .t{font-size:12px;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.stop .dot{position:relative}
.stop .dot::before{content:"";position:absolute;left:3px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.stop .dot::after{content:"";position:absolute;left:7px;top:16px;bottom:-4px;width:2px;background:var(--line)}
.stop:last-child .dot::after{display:none}
.stop:last-child .dot::before{background:var(--alert)}
.stop b{font-weight:500;font-size:14px;display:block}
.stop span{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.view{animation:in .14s ease-out}@keyframes in{from{opacity:.5}}}
</style>
</head>

  <div class="phone">
    <div class="screen" id="screen"></div>
  </div>
</div>

/* ---------- navigazione ---------- */
function go(view,arg,push=true){
  if(push&&cur) hist.push(cur);
  cur={view,arg};
  render();
}
let cur=null;
function back(){ if(!D) return; const p=hist.pop(); cur=p||{view:"home"}; render(); }
function home(){ if(!D) return; hist.length=0; cur={view:"home"}; render(); }

/* Calendario */
const MESI=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const GIORNI=["lunedì","martedì","mercoledì","giovedì","venerdì","sabato","domenica"];
const pad2=n=>String(n).padStart(2,"0");
function calStart(){const E=D.calendario||[];return D.calendario_mese||(E[0]&&E[0].data?E[0].data.slice(0,7):"2013-09")}
function vCal(arg){
  const E=(D.calendario||[]).slice().sort((a,b)=>(a.data+(a.ora||"")).localeCompare(b.data+(b.ora||"")));
  const st=arg||{mese:calStart(),giorno:null};
  const [y,m]=st.mese.split("-").map(Number);
  const first=new Date(y,m-1,1), days=new Date(y,m,0).getDate(), off=(first.getDay()+6)%7;
  const prevDays=new Date(y,m-1,0).getDate();
  const has=new Set(E.map(e=>e.data));
  const oggi=D.schermata.iso||"";
  let cells=GIORNI.map(g=>`<span class="wd">${g.slice(0,3)}</span>`).join("");
  for(let k=0;k<off;k++) cells+=`<span class="out">${prevDays-off+k+1}</span>`;
  for(let d=1;d<=days;d++){const iso=`${y}-${pad2(m)}-${pad2(d)}`;cells+=`<button data-day="${iso}" class="${has.has(iso)?"has":""} ${st.giorno===iso?"sel":""} ${oggi===iso?"today":""}">${d}</button>`}
  const tail=(7-((off+days)%7))%7; for(let k=1;k<=tail;k++) cells+=`<span class="out">${k}</span>`;
  const list=E.filter(e=>st.giorno?e.data===st.giorno:e.data&&e.data.startsWith(st.mese));
  const lab=st.giorno?(()=>{const dt=new Date(st.giorno+"T12:00");return `${GIORNI[(dt.getDay()+6)%7]} ${dt.getDate()} ${MESI[dt.getMonth()]}`})():`Eventi di ${MESI[m-1]}`;
  return `<div class="view">${bar("Calendario")}<div class="cal-head"><button data-mese="-1" aria-label="Mese precedente">‹</button><b>${MESI[m-1]} ${y}</b><button data-mese="1" aria-label="Mese successivo">›</button></div><div class="scroll"><div class="cal-grid">${cells}</div><div class="sect">${esc(lab)}</div>${list.length?list.map(e=>{const dt=new Date(e.data+"T12:00");return `<div class="ev"><i class="bar2"></i><div><b>${esc(e.titolo)}</b><span>${st.giorno?"":dt.getDate()+" "+MESI[dt.getMonth()]+(e.ora?" · ":"")}${esc(e.ora||(st.giorno?"Tutto il giorno":""))}${e.luogo?" · "+esc(e.luogo):""}</span>${e.note?`<span>${esc(e.note)}</span>`:""}</div></div>`}).join(""):empty("Nessun evento")}</div></div>`;
}
/* Posizioni */
function vMap(i){
  const L=D.posizioni||[];
  if(!L.length) return `<div class="view">${bar("Spostamenti")}<div class="scroll">${empty("Nessuna posizione registrata")}</div></div>`;
  const k=Math.max(0,Math.min(L.length-1,i==null?0:+i)), g=L[k], T=g.tappe||[];
  const CAR='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>';
  const PIN='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>';
  const visite=T.filter(s=>s.tipo!=="auto").length;
  const orario=s=>s.dalle&&s.alle?`${s.dalle} - ${s.alle}`:s.alle?`Orario di partenza: ${s.alle}`:s.dalle?`Orario di arrivo: ${s.dalle}`:"";
  const row=s=>s.tipo==="auto"
    ?`<div class="gm-row"><span class="gm-ic car">${CAR}</span><span class="gm-tx"><b>${esc(s.titolo||"Hai guidato")}</b><span>${esc([s.km,s.durata].filter(Boolean).join(" · "))}</span><span>${esc(orario(s))}</span></span></div>`
    :`<div class="gm-row"><span class="gm-ic dot"></span><span class="gm-tx"><b>${esc(s.nome)}</b><span>${esc(s.indirizzo||"")}</span><span>${esc(orario(s))}</span></span></div>`;
  return `<div class="view">${bar("Spostamenti")}<div class="scroll">${g.immagine?`<img class="mapimg" src="${g.immagine}" alt="Mappa">`:""}
  <div class="gm-day"><button data-go="map" data-a="${k-1}" ${k===0?"disabled":""} aria-label="Giorno precedente">‹</button><b>${esc(g.data_breve||g.giorno)}</b><button data-go="map" data-a="${k+1}" ${k===L.length-1?"disabled":""} aria-label="Giorno successivo">›</button></div>
  <div class="gm-sum"><span class="gm-s">${CAR}<span>${esc(g.km||"")}<br>${esc(g.durata||"")}</span></span><span class="gm-s">${PIN}<span>${visite} ${visite===1?"visita":"visite"}</span></span></div>
  <div class="gm-list">${T.map(row).join("")}</div></div></div>`;
}

const VIEWS={lock:vLock,home:vHome,spunta:vSpunta,spchat:vSpChat,cal:vCal,map:vMap,msg:vMsg,chat:vChat,call:vCall,note:vNote,nota:vNota,pic:vPic,foto:vFoto,mail:vMail,email1:vEmail1};

function render(){
  const view=D?cur.view:"lock";
  scr.innerHTML=statusBar()+VIEWS[view](cur&&cur.arg)+navBar();
  bind(view);
  const cs=document.getElementById("chatscroll"); if(cs) cs.scrollTop=cs.scrollHeight;
}

let pin="", busy=false;
function bind(view){
  scr.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go,b.dataset.a));
  scr.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>b.dataset.nav==="home"?home():back());
  scr.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{cur.arg=b.dataset.tab;render()});
  if(view==="cal"){
    const st=cur.arg||{mese:calStart(),giorno:null};
    scr.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{cur.arg={mese:st.mese,giorno:st.giorno===b.dataset.day?null:b.dataset.day};render()});
    scr.querySelectorAll("[data-mese]").forEach(b=>b.onclick=()=>{let [y,m]=st.mese.split("-").map(Number);m+=+b.dataset.mese;if(m<1){m=12;y--}if(m>12){m=1;y++}cur.arg={mese:`${y}-${pad2(m)}`,giorno:null};render()});
  }
  if(view==="lock"){
    const dots=[...scr.querySelectorAll(".dots span")];
    const draw=()=>dots.forEach((d,i)=>d.classList.toggle("on",i<pin.length));
    draw();
    scr.querySelectorAll("[data-k]").forEach(b=>b.onclick=async()=>{
      if(busy) return;
      const k=b.dataset.k, lm=document.getElementById("lm"), dd=document.getElementById("dots");
      dd.classList.remove("err"); lm.textContent="";
      if(k==="⌫"){pin=pin.slice(0,-1);draw();return}
      if(pin.length<PINLEN){pin+=k;draw()}
      if(pin.length===PINLEN){
        busy=true; lm.textContent="";
        if(!(window.crypto&&crypto.subtle)){busy=false;pin="";draw();lm.textContent="Apri il link con Chrome o Safari: questo visualizzatore non permette lo sblocco";return}
        const t=await tryDecrypt(DATI,pin); busy=false;
        if(t){D=JSON.parse(t);store.set("tel_pin",pin);pin="";cur={view:"home"};render()}
        else{dd.classList.add("err");lm.textContent="PIN errato";pin="";PINFAIL++;try{localStorage.setItem("tel_fail",PINFAIL)}catch(e){}const h=document.getElementById("hint");if(h)h.textContent=HINT();setTimeout(draw,350)}
      }
    });
  }
  const onGo=(inputId,fn)=>{
    const btn=document.getElementById("go"), inp=document.getElementById(inputId), err=document.getElementById("err");
    if(!btn||!inp) return;
    let busy=false;
    const run=async()=>{ if(busy) return; busy=true; err.textContent="";
      try{
        if(!(window.crypto&&crypto.subtle)){err.textContent="Apri il link con Chrome o Safari";return}
        await fn(inp.value, err);
      }catch(x){err.textContent="Errore: "+(x&&x.message||x)}
      finally{busy=false}
    };
    btn.onclick=run;
    inp.onkeydown=e=>{ if(e.key==="Enter"){e.preventDefault();run()} };
  };
  if(view==="nota"){
    onGo("code",async(code,err)=>{
      const i=cur.arg;
      const t=await tryDecrypt(D.note[i].enc,normc(code.trim()));
      if(t!=null){NOTE[i]=t;store.set("tel_nota_"+i,code.trim());render()} else err.textContent="Codice errato";
    });
  }
  if(view==="mail"){
    onGo("pw",async(pw,err)=>{
      const t=await tryDecrypt(D.email.enc,canonpw(pw));
      if(t!=null){POSTA=JSON.parse(t);store.set("tel_mail",pw);render()} else err.textContent="Password errata";
    });
  }
}

/* ---------- avvio ---------- */
async function start(){
  cur={view:"lock"}; render();
  const p=store.get("tel_pin");
  if(!p) return;
  const t=await tryDecrypt(DATI,p);
  if(!t) return;
  D=JSON.parse(t);
  const pw=store.get("tel_mail");
  if(pw&&D.email&&D.email.enc){const m=await tryDecrypt(D.email.enc,canonpw(pw)); if(m) POSTA=JSON.parse(m);}
  for(let i=0;i<(D.note||[]).length;i++){const n=D.note[i]; if(n.enc){const c=store.get("tel_nota_"+i); if(c){const x=await tryDecrypt(n.enc,normc(c)); if(x!=null) NOTE[i]=x;}}}
  cur={view:"home"}; render();
}
start();
</script>
